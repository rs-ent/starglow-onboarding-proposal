<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>STARGLOW · 온보딩 제안서 (편집본)</title>
<style>
  :root{
    --bg0:#EFE9F8; --bg1:#F7F4FC; --bg3:#6E2DC4;
    --nova:#8B3FD6; --gold:#6E2DC4; --pink:#E0489A; --mint:#1FA37A; --luna:#7B53C9;
    --ink:#241A3D; --ink2:#5C5475; --ink3:#9690A8;
    --surf:#FFFFFF; --surf2:#FBF9FE;
    --border:#ECE6F5; --border2:#D9CDEE;
    --r:22px; --rs:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink); line-height:1.6;
    background:
      radial-gradient(900px 600px at 10% -12%, rgba(110,45,196,.08), transparent 60%),
      radial-gradient(800px 600px at 102% 0%, rgba(224,72,154,.06), transparent 55%),
      linear-gradient(180deg, #F7F4FC 0%, #FFFFFF 58%);
  }
  .stars{display:none}
  /* 페이지 테두리 프레임 */
  .frame{position:fixed;inset:20px;border:1.5px solid var(--border2);border-radius:24px;pointer-events:none;z-index:8;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
  .footL{position:fixed;bottom:26px;left:44px;z-index:10;font-size:14.5px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
  .footR{position:fixed;bottom:22px;right:44px;z-index:10;font-weight:900;font-size:22px;letter-spacing:.16em;
    background:linear-gradient(90deg,#6E2DC4,#9B4DE0,#E0489A);-webkit-background-clip:text;background-clip:text;color:transparent}
  .footR.up{top:34px;left:44px;bottom:auto;right:auto;font-size:20px}
  @media(max-width:600px){ .frame{inset:10px;border-radius:16px} }

  /* DECK */
  .stage{position:fixed;inset:0;overflow:hidden;z-index:1}
  .deck{display:flex;height:100%;will-change:transform;
    transition:transform .6s cubic-bezier(.66,.02,.2,1)}
  .slide{flex:0 0 100vw;height:100vh;display:flex;align-items:center;justify-content:center;
    padding:60px 5vw 78px}
  .sInner{width:100%;max-width:1180px;max-height:100%;overflow-y:auto;overflow-x:hidden;
    padding:4px 6px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
  .sInner::-webkit-scrollbar{width:7px}
  .sInner::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}

  /* COVER */
  .cover{text-align:left;align-self:stretch;max-width:none;padding-top:6vh;
    display:flex;flex-direction:column;min-height:calc(100vh - 150px)}
  .coverStats{flex:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .coverStats .cstat{flex:1;min-width:200px;text-align:center}
  .cover .coverHead{border-left:12px solid var(--gold);padding-left:28px}
  .hlbox{display:inline-block;background:var(--gold);color:#fff;font-weight:900;letter-spacing:.04em;
    font-size:clamp(46px,8vw,104px);line-height:1.03;padding:5px 18px 11px}
  .cover .t1{font-weight:900;color:var(--ink);font-size:clamp(42px,7.6vw,98px);line-height:1.06;margin-top:9px;letter-spacing:.01em}
  .cover .t2{font-weight:900;color:#7A6F9C;font-size:clamp(42px,7.6vw,98px);line-height:1.06;letter-spacing:.01em}
  .cover .tagline{margin-top:30px;color:var(--ink2);font-size:clamp(16px,2.6vw,22px)}
  .cover .tagline .gt{color:var(--gold);letter-spacing:.08em}
  .cover .hint{margin-top:20px;color:var(--ink3);font-size:14px;text-align:left;animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  /* COVER 2-column + right stats */
  .coverGrid{display:flex;gap:5vw;align-items:center;flex-wrap:wrap}
  .coverLeft{flex:1 1 460px;min-width:300px}
  .coverRight{flex:0 1 360px;min-width:240px;display:flex;flex-direction:column;gap:16px}
  .cstat{background:linear-gradient(135deg,#6E2DC4,#9B4DE0);
    border:none;border-radius:18px;padding:24px 26px;box-shadow:0 14px 30px rgba(110,45,196,.30)}
  .cstat .cv{font-size:clamp(34px,5vw,52px);font-weight:900;color:#fff;line-height:1}
  .cstat .cl{font-size:15px;color:rgba(255,255,255,.92);margin-top:8px;font-weight:600}
  /* group KPI — 제목 옆 인라인 */
  .dhead{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
  .gkpi{display:inline-flex;flex-direction:column;align-items:center;gap:5px;
    background:linear-gradient(135deg,#6E2DC4,#9B4DE0);border:none;border-radius:14px;padding:12px 22px;
    box-shadow:0 10px 24px rgba(110,45,196,.28)}
  .gkpi .v{font-size:clamp(22px,3.2vw,32px);font-weight:900;color:#fff;line-height:1}
  .gkpi .l{font-size:13.5px;color:rgba(255,255,255,.92);font-weight:600}
  /* summary (한 장 요약) */
  .summary h2{font-size:clamp(26px,4.4vw,40px);font-weight:900;text-align:center;margin-bottom:6px}
  .summary .ssub{text-align:center;color:var(--ink3);font-size:15px;margin-bottom:24px}
  .sStats{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .sStats .cstat{flex:1;min-width:200px;text-align:center}
  .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .scard{background:var(--surf);border:1px solid var(--border);border-radius:18px;padding:22px;cursor:pointer;
    transition:.16s;box-shadow:0 8px 20px rgba(78,38,140,.06)}
  .scard:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 16px 30px rgba(78,38,140,.14)}
  .scard .sn{font-size:13px;font-weight:800;color:var(--nova);letter-spacing:.06em}
  .scard .st{font-size:19px;font-weight:900;color:var(--ink);margin:6px 0 8px;line-height:1.25}
  .scard .sk{font-size:15px;font-weight:800;color:var(--gold)}
  @media(max-width:780px){ .sgrid{grid-template-columns:1fr 1fr} }
  @media(max-width:520px){ .sgrid{grid-template-columns:1fr} }

  /* LEGEND */
  .panel{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:30px 30px}
  .panel h2{font-size:clamp(20px,3.6vw,28px);margin-bottom:8px}
  .panel .lead{color:var(--ink2);font-size:15px;margin-bottom:18px}
  .legendT{width:100%;border-collapse:collapse;font-size:14px}
  .legendT td{padding:10px 8px;border-top:1px solid var(--border);vertical-align:top}
  .legendT td:first-child{white-space:nowrap;width:130px}

  /* DIVIDER */
  .divider{text-align:center}
  .divider .em{font-size:clamp(44px,8vw,72px);filter:drop-shadow(0 10px 24px rgba(110,45,196,.22))}
  .divider .gnum{margin-top:14px;color:var(--gold);font-weight:800;letter-spacing:.14em;font-size:16px}
  .divider h2{font-size:clamp(32px,6vw,54px);font-weight:900;margin-top:6px}
  .divider .gsub{margin-top:14px;color:var(--ink2);font-size:clamp(16px,2.8vw,21px)}
  .idx{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:24px auto 0;max-width:980px}
  .idxbox{position:relative;display:flex;align-items:center;justify-content:center;gap:13px;cursor:pointer;text-align:center;
    flex:0 1 auto;min-width:230px;max-width:460px;
    background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:14px 20px;
    transition:.16s;box-shadow:0 6px 16px rgba(78,38,140,.06)}
  .idxbox:hover{border-color:var(--gold);background:rgba(110,45,196,.05);transform:translateY(-3px);box-shadow:0 14px 28px rgba(78,38,140,.14)}
  .idxbox .in{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(110,45,196,.10);color:var(--gold);font-weight:800;font-size:14px}
  .idxbox .it{font-size:17px;font-weight:800;color:var(--ink);line-height:1.3;white-space:nowrap}
  .idx.idxcol{flex-direction:column;align-items:center;gap:12px;max-width:1040px}
  .idxgroup{width:100%;background:#F7F4FB;border:1px solid var(--border);border-radius:18px;
    padding:14px 20px 18px;box-shadow:0 8px 22px rgba(78,38,140,.06)}
  .idxsec{width:100%;text-align:center;font-weight:800;color:var(--nova);font-size:16px;letter-spacing:.02em;margin:2px 0 12px}
  /* 레퍼런스 갤러리 */
  .refwrap{margin-top:24px;border-top:1px solid var(--border);padding-top:18px}
  .refcap{font-weight:800;color:var(--nova);font-size:15.5px;letter-spacing:.02em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .refcap .refn{background:var(--gold);color:#fff;font-size:12.5px;border-radius:999px;padding:2px 10px;font-weight:800}
  .refwith{display:inline-flex;align-items:center;gap:7px;margin-left:4px;color:var(--ink3);font-weight:700;font-size:13.5px}
  .refwith img{height:14px;width:auto;display:block;border-radius:3px}
  .refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:11px}
  .refitem{position:relative;display:block;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surf2);aspect-ratio:3/4;padding:0;cursor:zoom-in;width:100%}
  .refmeta{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 7px;font-size:11px;line-height:1.3;color:#fff;text-align:left;font-weight:700;
    background:linear-gradient(transparent,rgba(0,0,0,.82));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none}
  .refmsg{grid-column:1/-1;color:var(--ink3);font-size:14px;padding:12px 2px}
  /* 라이트박스 */
  .lightbox{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:40px;
    background:rgba(20,12,38,.86);backdrop-filter:blur(6px);cursor:zoom-out}
  .lightbox.on{display:flex}
  .lbinner{position:relative;display:inline-block;line-height:0}
  .lightbox img{max-width:min(96vw,1100px);max-height:92vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);cursor:zoom-out}
  .lbclose{position:absolute;top:10px;right:10px;z-index:61;width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(20,12,38,.55);color:#fff;font-size:20px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
  .lbclose:hover{background:rgba(20,12,38,.8)}
  @media(max-width:600px){ .lightbox{padding:16px} .lbclose{width:34px;height:34px;font-size:17px;top:7px;right:7px} }
  .refitem img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
  .refitem:hover img{transform:scale(1.06)}
  @media(max-width:600px){ .refgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))} }
  .idxrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
  /* 맞춤 제안서: 편집 체크박스 / 툴바 / 표지 개인화 */
  .idxchk{position:absolute;top:8px;right:8px;width:21px;height:21px;cursor:pointer;accent-color:var(--gold);z-index:3}
  body.editmode .idxbox{border-style:dashed;border-color:var(--border2)}
  body.editmode{padding-bottom:78px}
  .forname{display:inline-block;background:var(--gold);color:#fff;font-weight:800;font-size:clamp(14px,2vw,19px);
    padding:6px 18px;border-radius:999px;margin-bottom:18px;letter-spacing:.01em}
  .editbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:70;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    background:rgba(36,26,61,.96);backdrop-filter:blur(8px);color:#fff;padding:11px 15px;border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.4);max-width:95vw}
  .editbar .ebTitle{font-weight:800;font-size:13.5px;color:#E8D9FB;white-space:nowrap}
  .ebInput{border:none;border-radius:9px;padding:8px 12px;font-size:14px;min-width:150px;background:#fff;color:var(--ink);font-family:inherit}
  .ebBtn{border:none;border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:700;cursor:pointer;
    background:rgba(255,255,255,.16);color:#fff;white-space:nowrap;font-family:inherit}
  .ebBtn:hover{background:rgba(255,255,255,.3)}
  .ebPrimary{background:linear-gradient(90deg,#8B3FD6,#E0489A)}
  .ebPrimary:hover{filter:brightness(1.08)}
  .ebCount{font-size:13px;color:#D9C9F2;font-weight:700;white-space:nowrap}
  @media(max-width:600px){ .editbar{gap:6px;padding:9px 11px;bottom:10px} .ebInput{min-width:108px} .ebBtn{padding:7px 10px;font-size:12.5px} }
  /* 아티스트별 프리셋(저장된 카드 선택) */
  .ebPresets{display:flex;align-items:center;gap:7px;flex-wrap:wrap;width:100%;border-top:1px solid rgba(255,255,255,.14);padding-top:9px;margin-top:2px}
  .ebTitle2{font-weight:800;font-size:12.5px;color:#E8D9FB;white-space:nowrap}
  .ebEmpty{font-size:12.5px;color:#B9A9D6}
  .ebChip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px 5px 3px 11px}
  .ebChip .ebChipName{font-size:13px;font-weight:700;cursor:pointer;color:#fff}
  .ebChip .ebChipName:hover{text-decoration:underline}
  .ebChip button{border:none;background:rgba(255,255,255,.18);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1;display:grid;place-items:center;font-family:inherit}
  .ebChip button:hover{background:rgba(255,255,255,.34)}
  /* 5개 그룹은 3 + 2 로 고정 (고정개런티가 혼자 떨어지지 않게) */
  .idxrow.n5 .idxbox,.idxrow.n6 .idxbox{flex:0 0 calc(33.333% - 8px)}
  .idxplus{width:100%;text-align:center;color:var(--gold);font-size:32px;font-weight:900;line-height:1}
  .divider h2 .gn{color:var(--gold)}

  /* CARD */
  .card{background:var(--surf);
    border:1px solid var(--border);border-radius:var(--r);padding:38px 44px;
    box-shadow:0 16px 40px rgba(78,38,140,.10)}
  .card .num{font-size:15px;color:var(--nova);font-weight:800;letter-spacing:.1em}
  .card h2{margin:8px 0 16px;font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1.22}
  .lead2{display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,rgba(110,45,196,.10),rgba(224,72,154,.05));
    border:1px solid rgba(110,45,196,.20);border-radius:13px;padding:14px 18px;margin-bottom:18px;
    color:var(--gold);font-weight:800;font-size:clamp(17px,2.6vw,21px);line-height:1.4}
  .lead2::before{content:"✦";color:var(--gold);font-size:15px;flex:none}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .tag{font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;
    background:rgba(110,45,196,.08);color:var(--luna);border:1px solid rgba(110,45,196,.18)}
  .pain{color:var(--ink3);font-size:17px;font-style:italic;border-left:3px solid var(--pink);padding-left:16px;margin-bottom:16px}
  .ans{color:var(--ink2);font-size:18px;margin-bottom:18px;line-height:1.65}
  .ans b{color:var(--ink)}
  ul.give{list-style:none;display:grid;gap:11px}
  ul.give li{font-size:17px;color:var(--ink2);padding-left:24px;position:relative}
  ul.give li::before{content:"✦";position:absolute;left:0;color:var(--gold);font-size:13px;top:4px}
  table.spec{width:100%;border-collapse:collapse;margin-top:18px;font-size:16.5px;
    background:var(--surf);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  table.spec th,table.spec td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--border)}
  table.spec td{color:var(--ink2)}
  table.spec th{background:#F5F1FB;color:var(--nova);font-weight:700;width:42%}
  table.spec thead th{background:var(--gold);color:#fff;font-size:14px;letter-spacing:.04em;width:auto}
  table.spec thead th:first-child{width:42%}
  table.spec tr:last-child td,table.spec tr:last-child th{border-bottom:none}
  table.spec .big{color:var(--gold);font-weight:800}
  table.spec .reco .big{color:var(--mint)}
  .note{margin-top:16px;font-size:14px;color:var(--ink3)}

  /* INFOGRAPHICS */
  .donutWrap{display:flex;align-items:center;gap:22px;margin:6px 0 16px;flex-wrap:wrap}
  .donut{--p:90;width:150px;height:150px;border-radius:50%;flex:none;position:relative;
    background:conic-gradient(var(--gold) calc(var(--p)*1%), #E9E1F4 0);
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(110,45,196,.18)}
  .donut::after{content:"";position:absolute;inset:15px;border-radius:50%;background:#fff}
  .donut b{position:relative;z-index:1;font-size:36px;font-weight:900;color:var(--gold)}
  .donutTxt{font-size:18.5px;color:var(--ink2);flex:1;min-width:180px;line-height:1.5} .donutTxt b{color:var(--gold)}
  .bars{display:grid;gap:13px;margin:8px 0 16px}
  .bar{display:grid;grid-template-columns:minmax(100px,160px) 1fr auto;align-items:center;gap:14px}
  .bar .bl{font-size:15px;color:var(--ink2)}
  .bar .bt{height:18px;border-radius:9px;background:#EDE7F6;overflow:hidden}
  .bar .bf{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--nova),var(--gold))}
  .bar .bv{font-size:16px;font-weight:800;color:var(--gold);white-space:nowrap}
  .flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:10px 0 16px}
  .fstep{background:var(--surf2);border:1px solid var(--border2);border-radius:13px;padding:13px 19px;font-size:16px;font-weight:800;color:var(--ink)}
  .farr{color:var(--gold);font-weight:900;font-size:19px}
  .stats{display:flex;flex-wrap:wrap;gap:15px;margin:8px 0 16px}
  .stat{flex:1;min-width:150px;background:linear-gradient(160deg,var(--surf2),var(--surf));
    border:1px solid var(--border);border-radius:18px;padding:24px 18px;text-align:center;box-shadow:0 8px 20px rgba(78,38,140,.07)}
  .stat .sv{font-size:clamp(26px,5vw,40px);font-weight:900;color:var(--gold);line-height:1.05}
  .stat .sl{font-size:14.5px;color:var(--ink2);margin-top:9px}

  /* MENU */
  .opt{display:flex;gap:15px;align-items:flex-start;padding:18px 20px;border:1px solid var(--border);
    border-radius:var(--rs);margin-top:13px;cursor:pointer;transition:.16s}
  .opt:hover{border-color:var(--gold)}
  .opt.sel{background:rgba(110,45,196,.07);border-color:var(--gold)}
  .opt .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--border2);flex:none;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;transition:.16s}
  .opt.sel .box{background:var(--gold);border-color:var(--gold)}
  .opt .t{font-weight:800;font-size:17.5px}
  .opt .d{color:var(--ink2);font-size:15px;margin-top:4px}
  /* 인센티브 선택 그리드 */
  .optgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:10px}
  .optcard{display:flex;gap:14px;align-items:flex-start;padding:18px;border:1.5px solid var(--border);
    border-radius:16px;cursor:pointer;transition:.16s;background:var(--surf)}
  .optcard:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 12px 26px rgba(78,38,140,.12)}
  .optcard.sel{border-color:var(--gold);background:rgba(110,45,196,.06)}
  .optcard .lt{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(110,45,196,.10);
    color:var(--gold);font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center}
  .optcard.sel .lt{background:var(--gold);color:#fff}
  .optcard .ot{font-weight:800;font-size:16.5px}
  .optcard .od{color:var(--ink2);font-size:14px;margin-top:5px;line-height:1.45}
  /* 타입별 추천 리스트 */
  .recolist{display:grid;gap:12px;margin-top:12px}
  .recorow{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--border);
    border-radius:14px;background:var(--surf);box-shadow:0 5px 14px rgba(78,38,140,.05)}
  .recorow .rtag{flex:none;font-weight:800;color:var(--luna);background:rgba(110,45,196,.08);

/* ---------- RENDER ---------- */
/* dp(path): 편집 가능 요소에 data-p 속성을 붙인다. path가 null이면 비편집(정적). */
const dp = p => p!=null ? ` data-p="${p}"` : '';
function tagsHTML(tags){ return tags && tags.length ? `<div class="tags">${tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>`:''; }
function giveHTML(g,base){ return g && g.length ? `<ul class="give">${g.map((x,k)=>`<li${dp(base!=null?base+'.'+k:null)}>${x}</li>`).join('')}</ul>`:''; }
function specHTML(s,reco,cols,base,colsBase){ if(!(s&&s.length))return'';
  const head = cols?`<thead><tr><th${dp(colsBase!=null?colsBase+'.0':null)}>${cols[0]}</th><th${dp(colsBase!=null?colsBase+'.1':null)}>${cols[1]}</th></tr></thead>`:'';
  return `<table class="spec ${reco?'reco':''}">${head}<tbody>${s.map((r,k)=>`<tr><th${dp(base!=null?base+'.'+k+'.0':null)}>${r[0]}</th><td${dp(base!=null?base+'.'+k+'.1':null)}>${r[1]}</td></tr>`).join('')}</tbody></table>`; }
function donutHTML(d,base){ return `<div class="donutWrap"><div class="donut" style="--p:${d.pct}"><b${dp(base!=null?base+'.big':null)}>${d.big||d.pct+'%'}</b></div><div class="donutTxt"${dp(base!=null?base+'.label':null)}>${d.label||''}</div></div>`; }
function barsHTML(b){ return `<div class="bars">${b.map(x=>`<div class="bar"><span class="bl">${x.l}</span><span class="bt"><span class="bf" style="width:${x.pct}%"></span></span><span class="bv">${x.v}</span></div>`).join('')}</div>`; }
function flowHTML(f,base){ return `<div class="flow">${f.map((x,i)=>`${i?'<span class="farr">›</span>':''}<span class="fstep"${dp(base!=null?base+'.'+i:null)}>${x}</span>`).join('')}</div>`; }
function statsHTML(s,base){ return `<div class="stats">${s.map((x,k)=>`<div class="stat"><div class="sv"${dp(base!=null?base+'.'+k+'.v':null)}>${x.v}</div><div class="sl"${dp(base!=null?base+'.'+k+'.l':null)}>${x.l}</div></div>`).join('')}</div>`; }
function _esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function refsHTML(r){ if(!r||(!r.n&&!r.api))return'';
  const w = r.with?`<span class="refwith">with <img src="${r.with}" alt="파트너 로고"></span>`:'';
  let grid;
  if(r.api){ grid=`<div class="refgrid refapi" data-api="${_esc(r.api)}"><div class="refmsg">레퍼런스 불러오는 중…</div></div>`; }
  else { let imgs='';
    for(let i=1;i<=r.n;i++){ const u=`${r.dir}/${r.pre}${String(i).padStart(2,'0')}.jpg`;
      imgs+=`<button type="button" class="refitem" data-full="${u}"><img loading="lazy" src="${u}" alt="${_esc(r.cap||'레퍼런스')} ${i}"></button>`; }
    grid=`<div class="refgrid">${imgs}</div>`; }
  return `<div class="refwrap"><div class="refcap">📎 ${_esc(r.cap||'레퍼런스')}${w}</div>${grid}</div>`; }
const _apiCache={};
function fillApiRefs(scope){ (scope||document).querySelectorAll('.refapi:not([data-done])').forEach(g=>{
  g.setAttribute('data-done','1'); const url=g.dataset.api;
  const done=data=>{ const shows=(data&&(data.shows||data.items||data))||[];
    if(!shows.length){ g.innerHTML='<div class="refmsg">표시할 레퍼런스가 없습니다.</div>'; return; }
    g.innerHTML=shows.map(s=>{ const t=_esc(s.title); const meta=t+(s.location?` · ${_esc(s.location)}`:'');
      return `<button type="button" class="refitem" data-full="${_esc(s.image_url)}"><img loading="lazy" src="${_esc(s.image_url)}" alt="${t}"><span class="refmeta">${meta}</span></button>`; }).join(''); };
  if(_apiCache[url]){ done(_apiCache[url]); return; }
  fetch(url).then(r=>r.json()).then(d=>{ _apiCache[url]=d; done(d); })
    .catch(()=>{ g.innerHTML='<div class="refmsg">레퍼런스를 불러오지 못했습니다.</div>'; });
}); }

function render(s,i){

  if(s.type==='cover'){ const cs=s.cstats||[]; return `<div class="sInner cover">

    <div class="coverStats">
      ${cs.map((c,k)=>`<div class="cstat"><div class="cv"${dp(P&&P+'cstats.'+k+'.v')}>${c.v}</div><div class="cl"${dp(P&&P+'cstats.'+k+'.l')}>${c.l}</div></div>`).join('')}
    </div>

  if(s.type==='legend') return `<div class="sInner"><div class="panel">
    <h2>이 제안서 보는 법</h2>
    <div class="lead">슬라이드마다 <b>적용 대상 태그</b>가 붙어 있어요. 본인(아티스트·소속사)에 해당하는 태그가 달린 슬라이드를 중심으로 보시면 됩니다.</div>
    <table class="legendT">

      <tr><td><span class="tag">#중견기획사</span></td><td>비-HYBE 중견 — 자체 채널은 있으나 약한 곳</td></tr>
      <tr><td><span class="tag">#글로벌</span></td><td>해외 팬 비중이 크고 번역·결제가 미해결인 아티스트</td></tr>
      <tr><td><span class="tag">#대형</span></td><td>톱티어 — 런칭 간판이 되어줄 파트너</td></tr>
    </table>
  </div></div>`;

  if(s.type==='divider'){ const n=(String(s.gnum).match(/\d+/)||[''])[0];
    const extra = n==='6' ? `<div class="recolist" style="max-width:860px;margin:34px auto 0;text-align:left">${RECO.map(r=>`<div class="recorow"><span class="rtag">${r[0]}</span><span class="rcombo">${r[1]}</span></div>`).join('')}</div>` : '';
    const kpi = s.kpi ? `<div class="gkpi"><span class="v"${dp(P&&P+'kpi.v')}>${s.kpi.v}</span><span class="l"${dp(P&&P+'kpi.l')}>${s.kpi.l}</span></div>` : '';
    return `<div class="sInner divider">
    <div class="dhead"><h2><span class="gn">${n}.</span> <span${dp(P&&P+'title')}>${s.title}</span></h2>${kpi}</div>
    <div class="gsub"${dp(P&&P+'gsub')}>${s.gsub}</div>
    ${extra}
  </div>`; }

  if(s.type==='summary'){ const sc=s.scards||[]; return `<div class="sInner summary">
    <h2><span style="color:var(--gold)">✦</span> <span${dp(P&&P+'stitle')}>${s.stitle||''}</span> <span style="color:var(--gold)">✦</span></h2>
    <div class="ssub"${dp(P&&P+'ssub')}>${s.ssub||''}</div>
    <div class="sgrid">
    ${sc.map((c,k)=>`<div class="scard" data-group="${c[0]}"><div class="sn">GROUP ${c[0]}</div><div class="st"${dp(P&&P+'scards.'+k+'.1')}>${c[1]}</div><div class="sk"${dp(P&&P+'scards.'+k+'.2')}>${c[2]}</div></div>`).join('')}
    </div>
  </div>`; }

  if(s.type==='card') return `<div class="sInner"><div class="card">
    <div class="num"${dp(P&&P+'num')}>${s.num}</div>
    <h2${dp(P&&P+'title')}>${s.title}</h2>
    ${s.lead?`<div class="lead2"${dp(P&&P+'lead')}>${s.lead}</div>`:''}
    ${tagsHTML(s.tags)}
    ${s.pain?`<div class="pain"${dp(P&&P+'pain')}>${s.pain}</div>`:''}
    ${s.ans?`<div class="ans"${dp(P&&P+'ans')}>${s.ans}</div>`:''}
    ${s.stat?donutHTML(s.stat,P&&P+'stat'):''}
    ${s.stats?statsHTML(s.stats,P&&P+'stats'):''}
    ${s.bars?barsHTML(s.bars):''}
    ${s.flow?flowHTML(s.flow,P&&P+'flow'):''}
    ${giveHTML(s.give,P&&P+'give')}
    ${specHTML(s.spec,false,s.cols,P&&P+'spec',P&&P+'cols')}
    ${s.extra||''}
    ${s.note?`<div class="note"${dp(P&&P+'note')}>${s.note}</div>`:''}
    ${s.refs?refsHTML(s.refs):''}
  </div></div>`;

  if(s.type==='menu') return `<div class="sInner"><div class="card">
    <div class="num">SELECT</div>
    <h2>선택형 인센티브 메뉴</h2>
    <div class="ans">아티스트 규모·상황에 맞춰 <b>골라서 조합</b>하세요. (카드를 탭하면 선택)</div>
    <div class="optgrid">
    ${[['A','수익 배분 우대','팬 결제의 최대 90% 정산. 현금 부담 없이, 매출이 클수록 함께.'],
       ['B','활동 기반 보상','아티스트 활동마다 정액 지급 + 팬 활동마다 연동 적립.'],
       ['C','최소 수익 보장','일정 기간 최소 수익 보장 + 초과분 수익 배분. 손실 위험 0.'],
       ['D','고정 개런티','월 300만~1,000만. 매달·연간·선지급 중 선택.'],
       ['E','현금 0 · 비-돈 패키지','무료 구축 + 노출 + 마케팅 지원만으로 시작.']]
      .map(o=>`<div class="optcard" onclick="this.classList.toggle('sel')"><div class="lt">${o[0]}</div><div><div class="ot">${o[1]}</div><div class="od">${o[2]}</div></div></div>`).join('')}
    </div>
  </div></div>`;

  if(s.type==='reco') return `<div class="sInner"><div class="card">
    <div class="num">추천</div>
    <h2>타입별 추천 패키지</h2>
    <div class="ans">내 상황에 맞는 기본 조합을 빠르게 확인하세요. <b>보상·정산 방식은 1번에서 자유롭게 조합</b>할 수 있어요.</div>
    <div class="recolist">
    ${[['#중소신인','<b>수익 배분 90% + 현금 0 패키지</b> · 무료구축 + 노출으로 부담 없이 시작'],
       ['#솔로','<b>수익 배분 + 활동 보상</b> · 부담 줄이고 콘텐츠마다 보상'],
       ['#중견기획사','<b>수익 배분 + 최소 수익 보장</b> + 데이터 주권 + 공동마케팅'],
       ['#글로벌','<b>수익 배분</b> + 글로벌 결제·번역 + 해외 수요조사'],
       ['#대형','<b>MG · 고정 개런티 + 수익 배분</b> · 간판 우대·선별']]
      .map(r=>`<div class="recorow"><span class="rtag">${r[0]}</span><span class="rcombo">${r[1]}</span></div>`).join('')}
    </div>
  </div></div>`;

  if(s.type==='narrative'){ const bad=s.vsbad||[], good=s.vsgood||[]; return `<div class="sInner narr">
    <div class="qlabel"${dp(P&&P+'qlabel')}>${s.qlabel||''}</div>
    <div class="q"><span class="a"${dp(P&&P+'qa')}>${s.qa||''}</span>
    <span class="b"${dp(P&&P+'qb')}>${s.qb||''}</span></div>
    <div class="qtag"${dp(P&&P+'qtag')}>${s.qtag||''}</div>
    <div class="vs">
      <div class="vscol bad"><div class="vsh"${dp(P&&P+'vsbadh')}>${s.vsbadh||''}</div>${bad.map((x,k)=>`<div class="vsi"${dp(P&&P+'vsbad.'+k)}>${x}</div>`).join('')}</div>
      <div class="vsarrow">→</div>
      <div class="vscol good"><div class="vsh"${dp(P&&P+'vsgoodh')}>${s.vsgoodh||''}</div>${good.map((x,k)=>`<div class="vsi"${dp(P&&P+'vsgood.'+k)}>${x}</div>`).join('')}</div>
    </div>
  </div>`; }

  if(s.type==='closing'){ const tr=s.trust||[], st=s.steps||[]; return `<div class="sInner closing">
    <div class="qlabel"${dp(P&&P+'qlabel')}>${s.qlabel||''}</div>
    <h2${dp(P&&P+'ctitle')}>${s.ctitle||''}</h2>
    <div class="trust">
      ${tr.map((c,k)=>`<div class="tcard"><div class="tv"${dp(P&&P+'trust.'+k+'.v')}>${c.v}</div><div class="tl"${dp(P&&P+'trust.'+k+'.l')}>${c.l}</div></div>`).join('')}
    </div>
    <div class="flow" style="justify-content:center;margin:26px 0 18px">
      ${st.map((x,k)=>`${k?'<span class="farr">›</span>':''}<span class="fstep"${dp(P&&P+'steps.'+k)}>${x}</span>`).join('')}
    </div>
    <div class="cta"${dp(P&&P+'cta')}>${s.cta||''}</div>
    <div class="contact"${dp(P&&P+'contact')}>${s.contact||''}</div>
    <div class="note"${dp(P&&P+'note')}>${s.note||''}</div>
  </div>`; }
  return '';
}

/* ===== 맞춤 제안서: 카드 선택 / 아티스트용 링크 =====
   ?edit=1       → 편집 모드(체크박스 + 링크 생성)
   ?cards=1-3,.. → 선택된 카드만 보이는 아티스트용 보기
   ?for=이름     → 표지에 'For. 이름' 표시 */
const Q=new URLSearchParams(location.search);
const EDIT=!Q.has('cards'); // 평소엔 편집도구 ON, ?cards 링크면 아티스트용 필터 보기(도구 없음)
const FORNAME=(Q.get('for')||'').trim();
const SEL = Q.has('cards') ? new Set((Q.get('cards')||'').split(',').map(s=>s.trim()).filter(Boolean)) : null;
const VIEWFILTER = !!(SEL && !EDIT);
const selNum = num => SEL ? SEL.has(num) : true;
const chkInit = num => SEL ? SEL.has(num) : true;
let GROUPCARDS={};
function computeGroupCards(){ GROUPCARDS={}; let d=-1; DECK.forEach((s,i)=>{ if(s.type==='divider'){d=i;GROUPCARDS[d]=[];} else if(d>=0){ const nn=s.type==='reco'?'reco':(s.num||''); if(nn) GROUPCARDS[d].push(nn); } }); }
const dividerActive = i => !VIEWFILTER || (GROUPCARDS[i]||[]).some(selNum);
const groupActiveNum = g => { if(!VIEWFILTER) return true; if(g==='6'&&SEL.has('reco')) return true; for(const n of SEL){ if(n.indexOf(g+'-')===0) return true; } return false; };

/* 가로로 넘기는 슬라이드 = 표지·그룹표지(목차)·인트로·마무리만. 카드/메뉴/추천은 팝업 전용. */
const VISIBLE = new Set(['cover','summary','divider','narrative','closing']);
const deck = document.getElementById('deck');
const dotsEl = document.getElementById('dots');
const totEl = document.getElementById('tot');
const prog=document.getElementById('prog'), cur=document.getElementById('cur');
const prevB=document.getElementById('prev'), nextB=document.getElementById('next');
/* DECK 가 원격 업데이트되면 buildAll()로 재구성하므로 가변 상태로 둔다 */
let vis=[], slides=[], N=0, dots=[], deckToSlide={}, idx=0;

/* 목차 박스 라벨/버킷 */
const SHORT={'1-1':'아티스트 활동 보상','1-2':'팬 활동 연동 보상','1-3':'수익 배분 90%','1-4':'최소 수익 보장','1-5':'고정 개런티','1-6':'성과 보너스','1-7':'전환 비용 지원','2-1':'팬덤 앱 무료 구축','2-2':'공연 대행','2-3':'MD 판매 대행','2-4':'팬클럽 운영 대행','3-1':'팬덤 데이터 리포트','3-2':'해외 공연 수요조사','4-1':'노출 몰아주기','4-2':'오프라인 이벤트 지원','4-3':'생일 · 앨범 광고 · 팬서포트 지원','4-4':'팬덤 보상 구조','5-1':'AI 스튜디오 보이스 콘텐츠','5-2':'10개 국어 번역','5-3':'글로우캣 · 포토카드 가챠'};
const BUCKET={'1-1':'기본 보상 · 정산 방식 (택1)','1-2':'기본 보상 · 정산 방식 (택1)','1-3':'기본 보상 · 정산 방식 (택1)','1-4':'기본 보상 · 정산 방식 (택1)','1-5':'기본 보상 · 정산 방식 (택1)','1-6':'추가 인센티브','1-7':'추가 인센티브','2-1':'구축 & 운영 대행','2-2':'구축 & 운영 대행','2-3':'구축 & 운영 대행','2-4':'구축 & 운영 대행','4-1':'마케팅 지원','4-2':'마케팅 지원','4-3':'팬덤 확산 지원','4-4':'팬덤 확산 지원'};
const DIVSEC={'3':'데이터 · 분석 제공','5':'기술 · AI 제공'};
const boxHTML=m=>`<div class="idxbox" data-open="${m.i}">${EDIT?`<input type="checkbox" class="idxchk" data-num="${m.num}" ${chkInit(m.num)?'checked':''} onclick="event.stopPropagation()">`:''}${/\d-\d/.test(m.num)?`<span class="in">${m.num}</span>`:'<span class="in">✦</span>'}<span class="it">${m.label}</span></div>`;

/* group index boxes on each divider (목차 역할 · 클릭 시 점프) */
function buildIndexBoxes(){
  let di=-1, curG=''; const members={};
  DECK.forEach((s,i)=>{
    if(s.type==='divider'){di=i;members[i]=[];curG=(String(s.gnum).match(/\d+/)||[''])[0];}
    else if(di>=0){
      const label = s.type==='card'?(SHORT[s.num]||s.title) : s.type==='reco'?'타입별 추천 패키지 보기' : null;
      const num = s.type==='reco'?'reco':(s.num||'');
      if(label && (!VIEWFILTER || selNum(num))) members[di].push({i,label,num,bucket:(BUCKET[s.num]||DIVSEC[curG]||'')});
    }
  });
  Object.entries(members).forEach(([di,arr])=>{
    if(!arr.length) return;
    const pos=deckToSlide[di]; if(pos==null) return;
    const inner=slides[pos].querySelector('.sInner'); if(!inner) return;
    const wrap=document.createElement('div');
    if(arr.some(m=>m.bucket)){
      wrap.className='idx idxcol';
      const order=[]; const byb={};
      arr.forEach(m=>{ const b=m.bucket||'기타'; if(!byb[b]){byb[b]=[];order.push(b);} byb[b].push(m); });
      wrap.innerHTML=order.map(b=>`<div class="idxgroup"><div class="idxsec">${b}</div><div class="idxrow n${byb[b].length}">${byb[b].map(boxHTML).join('')}</div></div>`).join('<div class="idxplus">+</div>');
    } else {
      wrap.className='idx';
      wrap.innerHTML=arr.map(boxHTML).join('');
    }
    inner.appendChild(wrap);
  });
  document.querySelectorAll('.idxbox').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openModal(+b.dataset.open);}));
}

/* 요약 카드 → 해당 그룹 페이지로 이동 */
function buildSummaryLinks(){
  const gslide={};
  DECK.forEach((s,i)=>{ if(s.type==='divider'){ const n=(String(s.gnum).match(/\d+/)||[''])[0]; if(deckToSlide[i]!=null) gslide[n]=deckToSlide[i]; }});
  document.querySelectorAll('.scard').forEach(c=>c.addEventListener('click',()=>{ if(editMode) return; const p=gslide[c.dataset.group]; if(p!=null) go(p); }));
}

/* 전체 (재)빌드 — 최초 1회 + DECK 원격 업데이트 시 호출 */
function buildAll(){
  computeGroupCards();
  vis = DECK.map((s,i)=>({s,i})).filter(x=>VISIBLE.has(x.s.type));
  if(VIEWFILTER) vis = vis.filter(x=> x.s.type!=='divider' || dividerActive(x.i));
  deck.innerHTML = vis.map(x=>`<section class="slide">${render(x.s, x.i)}</section>`).join('');
  slides = [...deck.children];
  N = slides.length;
  totEl.textContent = N;
  deckToSlide = {}; vis.forEach((x,p)=>{ deckToSlide[x.i]=p; });
  dotsEl.innerHTML='';
  vis.forEach((x,p)=>{ const d=document.createElement('div');
    d.className='dot'+(x.s.type==='divider'||x.s.type==='cover'?' sec':'');
    d.onclick=()=>go(p); dotsEl.appendChild(d); });
  dots=[...dotsEl.children];
  buildIndexBoxes();
  buildSummaryLinks();
  if(VIEWFILTER){ document.querySelectorAll('.scard').forEach(c=>{ if(!groupActiveNum(c.dataset.group)) c.remove(); }); }
  if(FORNAME){ const cov=document.querySelector('.cover'); if(cov){ const b=document.createElement('div'); b.className='forname'; b.textContent='For. '+FORNAME; cov.insertBefore(b, cov.firstChild); } }
  go(Math.min(idx, Math.max(0,N-1)));
  applyEditable(document);
  applyLocks();
}

/* nav */
function go(i){
  idx=Math.max(0,Math.min(N-1,i));
  deck.style.transform=`translateX(${-idx*100}vw)`;
  cur.textContent=idx+1;
  prog.style.width=(N>1?idx/(N-1)*100:0)+'%';
  dots.forEach((d,k)=>d.classList.toggle('on',k===idx));
  slides.forEach((s,k)=>s.classList.toggle('active',k===idx)); // 등장 애니메이션 재생
  prevB.classList.toggle('disabled',idx===0);
  nextB.classList.toggle('disabled',idx===N-1);
  const fr=document.querySelector('.footR'); if(fr) fr.classList.toggle('up', idx!==0);
  const inner=slides[idx]&&slides[idx].querySelector('.sInner'); if(inner) inner.scrollTop=0;
}
prevB.onclick=()=>go(idx-1); nextB.onclick=()=>go(idx+1);

/* ===== 편집 모드(?edit): 체크박스로 카드 선택 → 아티스트용 링크 생성 (한 번만 설정) ===== */
function setupEditbar(){
  if(!EDIT || document.querySelector('.editbar')) return;
  document.body.classList.add('editmode');
  const bar=document.createElement('div'); bar.className='editbar';
  bar.innerHTML=`<span class="ebTitle">✎ 편집 모드</span>`+
    `<input id="artInput" class="ebInput" placeholder="아티스트 이름 (선택)" value="${_esc(FORNAME)}">`+
    `<button id="ebAll" class="ebBtn">전체 선택</button>`+
    `<button id="ebNone" class="ebBtn">전체 해제</button>`+
    `<span id="ebCount" class="ebCount"></span>`+
    `<button id="ebPrev" class="ebBtn">미리보기</button>`+
    `<button id="ebLink" class="ebBtn ebPrimary">아티스트용 링크 복사</button>`+
    `<button id="ebSavePreset" class="ebBtn">＋ 현재 선택 저장</button>`+
    `<div class="ebPresets" id="ebPresets"></div>`;
  document.body.appendChild(bar);
  const chks=()=>[...document.querySelectorAll('.idxchk')];
  const upd=()=>{ document.getElementById('ebCount').textContent=chks().filter(c=>c.checked).length+'개 선택'; };
  const linkURL=()=>{ const nums=chks().filter(c=>c.checked).map(c=>c.dataset.num);
    const u=new URL(location.href); u.searchParams.delete('edit'); u.searchParams.set('cards',nums.join(','));
    const nm=document.getElementById('artInput').value.trim(); if(nm) u.searchParams.set('for',nm); else u.searchParams.delete('for');
    return {nums,url:u.toString()}; };
  document.addEventListener('change',e=>{ if(e.target.classList&&e.target.classList.contains('idxchk')) upd(); });
  document.getElementById('ebAll').onclick=()=>{ chks().forEach(c=>c.checked=true); upd(); };
  document.getElementById('ebNone').onclick=()=>{ chks().forEach(c=>c.checked=false); upd(); };
  document.getElementById('ebPrev').onclick=()=>{ const {nums,url}=linkURL(); if(!nums.length){ alert('최소 한 개 이상 선택하세요.'); return; } open(url,'_blank'); };
  document.getElementById('ebLink').onclick=async()=>{ const {nums,url}=linkURL(); if(!nums.length){ alert('최소 한 개 이상 선택하세요.'); return; }
    const btn=document.getElementById('ebLink');
    try{ await navigator.clipboard.writeText(url); btn.textContent='복사됨! ✓'; setTimeout(()=>btn.textContent='아티스트용 링크 복사',1600); }
    catch(e){ prompt('아래 링크를 복사해서 아티스트에게 보내세요:', url); } };
  document.getElementById('ebSavePreset').onclick=savePreset;
  document.getElementById('ebPresets').addEventListener('click', e=>{
    const a=e.target.closest('[data-apply]'); if(a){ applyPreset(a.dataset.apply); return; }
    const l=e.target.closest('[data-link]'); if(l){ copyPresetLink(l.dataset.link); return; }
    const d=e.target.closest('[data-del]'); if(d){ deletePreset(d.dataset.del); return; }
  });
  renderPresets();
  upd();
}

/* modal (목차 박스 클릭 → 팝업 창) */
const modal=document.getElementById('modal'), mbody=document.getElementById('mbody');
function openModal(i){ mbody.innerHTML=render(DECK[i], i); fillApiRefs(mbody); applyEditable(mbody); applyLocks(); modal.classList.add('on'); modal.scrollTop=0; const mb=modal.querySelector('.mbox'); if(mb) mb.scrollTop=0; }
function closeModal(){ modal.classList.remove('on'); }
document.getElementById('mclose').onclick=closeModal;
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });

/* lightbox (레퍼런스 사진 크게 보기 — 새 탭 대신 화면 안에서) */
const lightbox=document.getElementById('lightbox'), lbimg=document.getElementById('lbimg');
function openLightbox(u){ lbimg.src=u; lightbox.classList.add('on'); }
function closeLightbox(){ lightbox.classList.remove('on'); lbimg.src=''; }
document.addEventListener('click',e=>{ const t=e.target.closest('.refitem'); if(t){ e.stopPropagation(); openLightbox(t.dataset.full); } });
document.getElementById('lbclose').onclick=closeLightbox;
lightbox.addEventListener('click',e=>{ if(e.target!==document.getElementById('lbclose')) closeLightbox(); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&lightbox.classList.contains('on')) closeLightbox(); });

/* wheel → horizontal, but allow inner vertical scroll first */
let lock=false;
addEventListener('wheel', e=>{
  if(modal.classList.contains('on')) return; // 모달 열려 있으면 모달 안 스크롤
  const inner=slides[idx]&&slides[idx].querySelector('.sInner');
  const can = inner && inner.scrollHeight > inner.clientHeight+2;
  const d = Math.abs(e.deltaX)>Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(can){
    const atTop=inner.scrollTop<=0, atBot=inner.scrollTop+inner.clientHeight>=inner.scrollHeight-1;
    if((d>0&&!atBot)||(d<0&&!atTop)) return; // let it scroll inside
  }
  e.preventDefault();
  if(lock||Math.abs(d)<6) return;
  lock=true; setTimeout(()=>lock=false,640);
  go(idx+(d>0?1:-1));
},{passive:false});

/* keyboard */
addEventListener('keydown', e=>{
  const ae=document.activeElement;
  if(ae && (ae.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) return; // 편집/입력 중엔 슬라이드 이동 금지
  const hp=document.getElementById('hpanel');
  if(hp && hp.classList.contains('on')){ if(e.key==='Escape') hp.classList.remove('on'); return; }
  if(modal.classList.contains('on')){ if(e.key==='Escape') closeModal(); return; }
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(idx+1);}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(idx-1);}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(N-1);}
});

/* touch swipe (horizontal) */
let sx=0,sy=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  if(modal.classList.contains('on') || editMode) return; // 편집 모드에선 스와이프 이동 금지
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) go(idx+(dx<0?1:-1));
},{passive:true});

/* =========================================================
   인라인 편집 + Firebase Firestore 실시간 공유 편집
   - DECK 전체를 JSON 문자열(deckJSON)로 한 문서에 저장
     (Firestore 는 배열-안-배열을 못 쓰므로 통째로 직렬화)
   - 누가 편집하면 800ms 디바운스로 저장 → onSnapshot 으로 모두 동기화
   ========================================================= */

/* ▼▼▼ 본인 Firebase 프로젝트의 웹 config (공개값 — 보안은 Firestore 규칙으로) ▼▼▼ */
const FB_CONFIG = {
  apiKey: "AIzaSyBetVrNpgvJbyJ42rE06W_Wzyxp97fz-zk",
  authDomain: "yves-8cb44.firebaseapp.com",
  projectId: "yves-8cb44",
  storageBucket: "yves-8cb44.firebasestorage.app",
  messagingSenderId: "663536971172",
  appId: "1:663536971172:web:0e64fc0eb1a085f341a531",
  measurementId: "G-7MZWBY151Q"
};
/* ===== 라우팅: edit.html#{아티스트}/{버전}  ·  해시 없으면 #list(목록) ===== */
function docIdFor(a,v){ return (String(a)+'__'+String(v)).replace(/[\/#?.\[\]*]/g,'-').slice(0,300); }
function hashFor(a,v){ return '#'+encodeURIComponent(a)+'/'+encodeURIComponent(v); }
function routeInfo(){
  const h=decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();
  if(!h || h==='list') return {mode:'list'};
  const i=h.indexOf('/');
  const artist=(i<0?h:h.slice(0,i)).trim();
  const version=(i<0?'v1':h.slice(i+1)).trim()||'v1';
  return {mode:'edit', artist, version, id:docIdFor(artist,version)};
}
const ROUTE = routeInfo();
const DOC = { col: "proposals", id: ROUTE.id || "onboarding-live" }; // 현재 라우트의 저장 위치
addEventListener('hashchange', ()=> location.reload()); // 다른 제안서로 이동 = 새로 로드
/* ▲▲▲ ───────────────────────────────────────────── ▲▲▲ */

let db=null, editMode=false, saveTimer=null, pendingRemote=null;
let lastJSON = JSON.stringify(DECK);
let editorName = localStorage.getItem('sg_editor') || '';

/* 공유 편집용 세션 정체성 / 상태 */
const SID = 's_' + Math.random().toString(36).slice(2,10);
const COLORS = ['#E0489A','#8B3FD6','#1FA37A','#F0892F','#2D7FF0','#C7417B','#36c79a','#9B4DE0'];
function colorFor(str){ let h=0; for(const ch of str) h=(h*31+ch.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; }
const myColor = colorFor(SID);
let presenceList = [];   // [{sid,name,color,focus,atMs}]
let historyList = [];    // [{id,deckJSON,by,at(Date)}]
let presetsList = [];    // [{id,name,cards[]}] — 아티스트별 카드 선택 묶음
let myFocus = null;      // 내가 지금 편집 중인 칸 경로
let heartbeat = null;    // presence 갱신 타이머
let lastSnapshotJSON = JSON.stringify(DECK); // 마지막으로 이력에 남긴 상태

const statusEl = document.getElementById('edStatus');
const setStatus = t => { if(statusEl) statusEl.textContent = t; };
const configured = () => FB_CONFIG.apiKey && !FB_CONFIG.apiKey.includes('PASTE');
const isEditingNow = () => { const a=document.activeElement; return !!(a && a.isContentEditable); };

/* --- 편집 경로(data-p)로 DECK 값 쓰기: "12.spec.3.1" → DECK[12].spec[3][1] --- */
function setPath(obj, path, val){
  const keys = path.split('.'); let o = obj;
  for(let k=0;k<keys.length-1;k++){ o = o[keys[k]]; if(o==null) return; }
  o[keys[keys.length-1]] = val;
}

/* --- contenteditable 토글 --- */
function applyEditable(root){
  root.querySelectorAll('[data-p]').forEach(el=>{
    if(editMode) el.setAttribute('contenteditable','true');
    else el.removeAttribute('contenteditable');
  });
}

/* ===== ② 충돌 방지: 접속자(presence) + 칸별 잠금 ===== */
const presenceColl = () => db.collection(DOC.col).doc(DOC.id).collection('presence');
const ACTIVE_MS = 35000; // 이 시간 안에 신호가 있으면 '접속 중'

function activeOthers(){
  const now = Date.now();
  return presenceList.filter(p => p.sid!==SID && (now - p.atMs) < ACTIVE_MS);
}
/* 다른 편집자가 점유한 칸 → Map(path → {name,color}) */
function currentLocks(){
  const m = new Map();
  activeOthers().forEach(p => { if(p.focus) m.set(p.focus, {name:(p.name||'익명'), color:p.color||'#888'}); });
  return m;
}
function applyLocks(){
  const locks = currentLocks();
  document.querySelectorAll('[data-p]').forEach(el=>{
    const lk = locks.get(el.dataset.p);
    if(lk){
      el.classList.add('locked');
      el.style.setProperty('--lk', lk.color);
      el.setAttribute('data-lk', lk.name + ' 편집 중');
      if(editMode) el.setAttribute('contenteditable','false'); // 잠긴 칸은 못 고침
    } else {
      el.classList.remove('locked');
      el.removeAttribute('data-lk');
      el.style.removeProperty('--lk');
      if(editMode) el.setAttribute('contenteditable','true');
    }
  });
}
function renderPresence(){
  const box = document.getElementById('edPeople'); if(!box) return;
  const others = activeOthers();
  box.innerHTML = others.slice(0,5).map(p=>{
    const init = (p.name||'?').trim().slice(0,1) || '?';
    return `<span class="av" style="background:${p.color||'#888'}" title="${(p.name||'익명')}${p.focus?' · 편집 중':''}">${init}</span>`;
  }).join('') + (others.length>5?`<span class="av" style="background:#9690A8" title="외 ${others.length-5}명">+${others.length-5}</span>`:'');
}

/* presence 쓰기 / 시작 / 정리 */
function writePresence(){
  if(!db) return;
  presenceColl().doc(SID).set({
    name: editorName || '익명', color: myColor, focus: myFocus || null,
    at: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true}).catch(()=>{});
}
function startPresence(){
  if(!db) return;
  writePresence();
  clearInterval(heartbeat);
  heartbeat = setInterval(writePresence, 15000);
}
function stopPresence(){
  clearInterval(heartbeat); heartbeat=null; myFocus=null;
  if(db) presenceColl().doc(SID).delete().catch(()=>{});
}
function setFocusPath(path){ myFocus = path || null; writePresence(); }

let toastTimer=null;
function showToast(msg){
  let t=document.getElementById('edtoast');
  if(!t){ t=document.createElement('div'); t.id='edtoast'; t.className='edtoast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'), 2800);
}
function setEditMode(on){
  editMode = on;
  document.body.classList.toggle('editing', on);
  applyEditable(document);
  applyLocks();
  const btn=document.getElementById('edToggle');
  if(btn){ btn.textContent = on ? '✓ 편집 완료' : '✎ 편집'; btn.classList.toggle('on', on); }
  setStatus(on ? '편집 중 — 클릭해 수정' : (configured()?'동기화됨':'로컬 전용'));
  if(on){ startPresence(); showToast('✎ 글자를 클릭해 바로 수정하세요 · 자동 저장됩니다'); }
  else {
    stopPresence();
    writeHistory();                       // 편집 종료 = 버전 1개 남김
    if(pendingRemote){ const p=pendingRemote; pendingRemote=null; applyRemote(p); } // 대기 중 원격 반영
  }
}

/* --- 입력 → DECK 갱신 + 저장 예약 (이벤트 위임) --- */
document.addEventListener('input', e=>{
  const el=e.target;
  if(!editMode || !el.dataset || el.dataset.p==null) return;
  setPath(DECK, el.dataset.p, el.innerHTML);
  scheduleSave();
});
/* 붙여넣기는 서식 없이 순수 텍스트로 (지저분한 HTML 방지) */
document.addEventListener('paste', e=>{
  const el=e.target;
  if(!editMode || !el.dataset || el.dataset.p==null) return;
  e.preventDefault();
  const t=((e.clipboardData||window.clipboardData).getData('text/plain')||'');
  document.execCommand('insertText', false, t);
});
/* Enter = 수정 확정(칸 나가기), Shift+Enter = 줄바꿈 */
document.addEventListener('keydown', e=>{
  if(!editMode || e.key!=='Enter' || e.shiftKey) return;
  const el=document.activeElement;
  if(el && el.dataset && el.dataset.p!=null){ e.preventDefault(); el.blur(); }
});
/* 편집 칸에 들어가면 → 그 칸을 내가 점유(presence.focus) → 남들에게 잠금 표시 */
document.addEventListener('focusin', e=>{
  const el=e.target;
  if(editMode && el.dataset && el.dataset.p!=null && !el.classList.contains('locked')) setFocusPath(el.dataset.p);
});
/* 편집 칸에서 포커스가 빠지면 → 점유 해제 + 대기 중이던 원격 변경 반영 */
document.addEventListener('focusout', ()=>{ setTimeout(()=>{
  if(!isEditingNow()){
    if(editMode && myFocus){ setFocusPath(null); }
    if(pendingRemote){ const p=pendingRemote; pendingRemote=null; applyRemote(p); }
  }
},80); });

/* --- 저장 (디바운스) --- */
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveDeck, 800); }
function saveDeck(){
  lastJSON = JSON.stringify(DECK);
  if(!db){ setStatus('로컬 전용 (미저장)'); return; }
  setStatus('저장 중…');
  db.collection(DOC.col).doc(DOC.id).set({
    deckJSON: lastJSON,
    artist: (ROUTE.artist||''), version: (ROUTE.version||''),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy: editorName || '익명'
  }, {merge:true})
   .then(()=> setStatus('저장됨 ✓'))
   .catch(err=> setStatus('저장 실패: '+(err.code||err.message)));
}

/* --- 원격 변경 반영 --- */
function applyRemote(json, by){
  let next; try{ next=JSON.parse(json); }catch{ return; }
  DECK = next; lastJSON = json;
  buildAll();
  setStatus('업데이트됨' + (by ? ' · '+by : ''));
}

/* ===== ③ 변경 이력 + 되돌리기 ===== */
const historyColl = () => db.collection(DOC.col).doc(DOC.id).collection('history');
function previewOf(json){
  try{ const d=JSON.parse(json); const card=d.find(x=>x.type==='card'&&x.title); return card?card.title.replace(/<[^>]+>/g,''):'(제안서)'; }
  catch{ return '(스냅샷)'; }
}
function fmtTime(dt){
  if(!dt) return '방금';
  const p=n=>String(n).padStart(2,'0');
  return `${dt.getMonth()+1}/${dt.getDate()} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
}
/* 현재 상태를 이력에 1건 추가 (직전 스냅샷과 같으면 생략) */
function writeHistory(){
  if(!db) return;
  const json = JSON.stringify(DECK);
  if(json === lastSnapshotJSON) return;
  lastSnapshotJSON = json;
  historyColl().add({ deckJSON:json, by:editorName||'익명', at:firebase.firestore.FieldValue.serverTimestamp() })
    .then(()=> setStatus('이력 저장됨'))
    .catch(()=>{});
}
function renderHistory(){
  const list=document.getElementById('hlist'); if(!list) return;
  const cur=JSON.stringify(DECK);
  if(!historyList.length){ list.innerHTML='<div class="hempty">아직 저장된 이력이 없어요.<br/>“지금 상태 저장”을 누르거나 편집을 마치면 버전이 쌓입니다.</div>'; return; }
  list.innerHTML = historyList.map(h=>{
    const isCur = h.deckJSON===cur;
    return `<div class="hrow${isCur?' cur':''}">
      <div class="hmeta"><span>${fmtTime(h.at)} · ${h.by||'익명'}</span>${isCur?'<span class="badge">현재</span>':''}</div>
      <div class="hprev">${previewOf(h.deckJSON)}</div>
      ${isCur?'':`<button class="hrestore" data-restore="${h.id}">이 버전으로 복원</button>`}
    </div>`;
  }).join('');
  list.querySelectorAll('[data-restore]').forEach(b=>b.addEventListener('click',()=>{
    const h=historyList.find(x=>x.id===b.dataset.restore); if(h) restoreSnapshot(h.deckJSON, h.by);
  }));
}
function restoreSnapshot(json, by){
  applyRemote(json, by);
  saveDeck();        // 복원본을 현재(live)로 만들어 모두에게 동기화
  setStatus('복원됨' + (by?' · '+by:''));
}
/* 되돌리기: 현재와 다른 가장 최근 이력으로 복귀 */
function undo(){
  const cur=JSON.stringify(DECK);
  const target=historyList.find(h=>h.deckJSON && h.deckJSON!==cur);
  if(!target){ setStatus('되돌릴 이력 없음'); return; }
  restoreSnapshot(target.deckJSON, target.by);
}

/* ===== 제안서 복제 / 새로 만들기 / 목록 ===== */
async function createProposal(artist, version, deckJSON){
  if(!db){ alert('클라우드 연결이 필요해요.'); return null; }
  const id=docIdFor(artist,version), ref=db.collection(DOC.col).doc(id);
  const snap=await ref.get();
  if(snap.exists && !confirm(`이미 "${artist} / ${version}" 가 있어요. 그 위에 덮어쓸까요?`)) return null;
  await ref.set({ deckJSON, artist, version,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(), updatedBy:editorName||'익명' }, {merge:true});
  return id;
}
function promptNewProposal(seedJSON){
  const artist=(prompt('아티스트 이름:','')||'').trim(); if(!artist) return;
  const version=(prompt('버전 (예: v1, 2026):','v1')||'').trim()||'v1';
  createProposal(artist, version, seedJSON).then(id=>{ if(id) location.href='edit.html'+hashFor(artist,version); });
}
function cloneCurrent(){ promptNewProposal(JSON.stringify(DECK)); }  // 지금 보는 내용을 새 아티스트/버전으로 복제

/* ===== 목록 페이지 (#list) ===== */
function initListView(){
  document.body.classList.add('listmode');
  const wrap=document.createElement('div'); wrap.className='listView'; wrap.id='listView';
  wrap.innerHTML='<div class="lvHead"><h1>제안서 목록</h1><button id="lvNew" class="lvNewBtn" type="button">＋ 새 제안서 만들기</button></div><div class="lvGrid" id="lvGrid"><div class="lvEmpty">불러오는 중…</div></div>';
  document.body.appendChild(wrap);
  const grid=document.getElementById('lvGrid');
  document.getElementById('lvNew').onclick=()=> promptNewProposal(JSON.stringify(DECK));
  if(!configured() || typeof firebase==='undefined'){ grid.innerHTML='<div class="lvEmpty">클라우드가 설정되지 않았어요.</div>'; return; }
  try{ firebase.initializeApp(FB_CONFIG); }catch(e){}
  db=firebase.firestore();
  db.collection(DOC.col).onSnapshot(snap=>{
    const items=[];
    snap.forEach(d=>{ const v=d.data()||{}; if(d.id==='onboarding-live'&&!v.artist) return; if(!v.deckJSON) return;
      items.push({id:d.id, artist:v.artist||d.id, version:v.version||'', at:(v.updatedAt&&v.updatedAt.toDate)?v.updatedAt.toDate():null, by:v.updatedBy}); });
    renderList(items);
  }, e=> grid.innerHTML='<div class="lvEmpty">불러오기 오류: '+(e.code||e.message)+'</div>');
}
function renderList(items){
  const g=document.getElementById('lvGrid'); if(!g) return;
  items.sort((a,b)=> String(a.artist||'').localeCompare(String(b.artist||''),'ko') || String(a.version||'').localeCompare(String(b.version||'')));
  g.innerHTML = items.length ? items.map(it=>`<div class="lvCard">
    <div class="lvArtist">${_esc(it.artist)}</div>
    <div class="lvVer">${_esc(it.version||'')}</div>
    <div class="lvMeta">${it.at?fmtTime(it.at):''}${it.by?' · '+_esc(it.by):''}</div>
    <div class="lvBtns"><a class="lvOpen" href="${hashFor(it.artist,it.version)}">열기 ›</a><button class="lvDel" data-id="${_esc(it.id)}" type="button">삭제</button></div>
  </div>`).join('') : '<div class="lvEmpty">아직 제안서가 없어요. “＋ 새 제안서 만들기”로 시작하세요.</div>';
  g.querySelectorAll('.lvDel').forEach(b=>b.addEventListener('click',()=>{ const it=items.find(x=>x.id===b.dataset.id);
    if(it && confirm(`"${it.artist} / ${it.version}" 제안서를 삭제할까요? (되돌릴 수 없어요)`)) db.collection(DOC.col).doc(it.id).delete(); }));
}

/* ===== 아티스트별 프리셋: 카드 선택 묶음을 DB에 공유 저장 (?edit 모드) ===== */
const presetsColl = () => db.collection(DOC.col).doc(DOC.id).collection('presets');
function checkedNums(){ return [...document.querySelectorAll('.idxchk')].filter(c=>c.checked).map(c=>c.dataset.num); }
function updateEbCount(){ const el=document.getElementById('ebCount'); if(el) el.textContent=[...document.querySelectorAll('.idxchk')].filter(c=>c.checked).length+'개 선택'; }
function setCheckboxes(cards){ const set=new Set(cards||[]); document.querySelectorAll('.idxchk').forEach(c=>{ c.checked=set.has(c.dataset.num); }); updateEbCount(); }
function presetLinkURL(p){ const u=new URL(location.href); u.searchParams.delete('edit'); u.searchParams.set('cards',(p.cards||[]).join(',')); if(p.name) u.searchParams.set('for',p.name); else u.searchParams.delete('for'); return u.toString(); }
function applyPreset(id){ const p=presetsList.find(x=>x.id===id); if(!p) return; setCheckboxes(p.cards); const ai=document.getElementById('artInput'); if(ai) ai.value=p.name||''; setStatus('프리셋 적용 · '+(p.name||'')); }
function copyPresetLink(id){ const p=presetsList.find(x=>x.id===id); if(!p) return; const url=presetLinkURL(p);
  navigator.clipboard.writeText(url).then(()=>setStatus('링크 복사됨 · '+(p.name||''))).catch(()=>prompt('아래 링크를 복사해서 보내세요:', url)); }
function deletePreset(id){ const p=presetsList.find(x=>x.id===id); if(!p) return; if(!confirm(`"${p.name||''}" 프리셋을 삭제할까요?`)) return; if(db) presetsColl().doc(id).delete(); }
function savePreset(){
  const ai=document.getElementById('artInput'); let name=(ai&&ai.value.trim())||'';
  name=(prompt('아티스트(프리셋) 이름을 입력하세요:', name)||'').trim(); if(!name) return;
  const cards=checkedNums(); if(!cards.length){ alert('카드를 1개 이상 선택하세요.'); return; }
  if(!db){ alert('클라우드 연결이 필요해요.'); return; }
  presetsColl().add({ name, cards, by:editorName||'익명', at:firebase.firestore.FieldValue.serverTimestamp() })
    .then(()=> setStatus('프리셋 저장됨 · '+name)).catch(e=> setStatus('저장 실패: '+(e.code||e.message)));
}
function renderPresets(){
  const box=document.getElementById('ebPresets'); if(!box) return;
  box.innerHTML = '<span class="ebTitle2">저장된 아티스트:</span>' + (presetsList.length
    ? presetsList.map(p=>`<span class="ebChip"><b class="ebChipName" data-apply="${p.id}" title="이 선택 불러오기">${_esc(p.name||'(이름없음)')}</b><button data-link="${p.id}" title="이 선택으로 아티스트용 링크 복사">🔗</button><button data-del="${p.id}" title="삭제">✕</button></span>`).join('')
    : '<span class="ebEmpty">아직 없음 — 카드 고르고 “＋ 현재 선택 저장”</span>');
}

/* --- Firebase 시작 --- */
function initCloud(){
  if(!configured()){ setStatus('로컬 전용 (Firebase 미설정)'); return; }
  if(typeof firebase==='undefined'){ setStatus('Firebase SDK 로드 실패'); return; }
  try{
    firebase.initializeApp(FB_CONFIG);
    db = firebase.firestore();
    setStatus('연결 중…');
    db.collection(DOC.col).doc(DOC.id).onSnapshot(snap=>{
      if(!snap.exists){ setStatus('초기 저장 중…'); saveDeck(); return; } // 최초 1회 시드
      const data = snap.data() || {};
      if(!data.deckJSON) return;
      if(data.deckJSON === lastJSON){ setStatus('동기화됨'); return; } // 내 변경 메아리
      if(isEditingNow()){ pendingRemote = data.deckJSON; setStatus('원격 변경 대기'); return; } // 편집 중엔 보류
      applyRemote(data.deckJSON, data.updatedBy);
    }, err=> setStatus('연결 오류: '+(err.code||err.message)));

    // ② presence(접속자/잠금) 실시간 구독
    presenceColl().onSnapshot(snap=>{
      presenceList = [];
      snap.forEach(d=>{ const v=d.data()||{}; presenceList.push({
        sid:d.id, name:v.name, color:v.color, focus:v.focus||null,
        atMs: (v.at && v.at.toMillis) ? v.at.toMillis() : Date.now()
      }); });
      renderPresence(); applyLocks();
    }, ()=>{});

    // ③ 변경 이력 실시간 구독 (최근 30개)
    historyColl().orderBy('at','desc').limit(30).onSnapshot(snap=>{
      historyList = [];
      snap.forEach(d=>{ const v=d.data()||{}; historyList.push({
        id:d.id, deckJSON:v.deckJSON, by:v.by, at:(v.at && v.at.toDate)?v.at.toDate():null
      }); });
      renderHistory();
    }, ()=>{});

    // 아티스트별 프리셋(카드 선택 묶음) 실시간 구독
    presetsColl().onSnapshot(snap=>{
      presetsList = [];
      snap.forEach(d=>{ const v=d.data()||{}; presetsList.push({ id:d.id, name:v.name, cards:v.cards||[] }); });
      presetsList.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko'));
      renderPresets();
    }, ()=>{});
  }catch(e){ console.error(e); setStatus('Firebase 오류'); }
}

function setupGearToggle(){
  const counter=document.querySelector('.counter'); if(!counter || document.getElementById('cbToggle')) return;
  const gear=document.createElement('button'); gear.id='cbToggle'; gear.type='button'; gear.title='편집 도구 켜기/끄기'; gear.textContent='⚙';
  counter.insertBefore(gear, counter.firstChild); counter.classList.add('has-gear');
  gear.onclick=()=>{ const on=document.body.classList.toggle('tools'); gear.classList.toggle('on', on); };
}

/* starfield */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');let stars=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;
  stars=Array.from({length:90},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.3,a:Math.random(),s:Math.random()*.02+.004}));}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
  stars.forEach(st=>{st.a+=st.s;const o=(Math.sin(st.a)+1)/2;
    cx.beginPath();cx.arc(st.x,st.y,st.r,0,7);cx.fillStyle='rgba(255,240,210,'+(o*.8)+')';cx.fill();});
  requestAnimationFrame(tick);}
addEventListener('resize',rs);rs();tick();
</script>
